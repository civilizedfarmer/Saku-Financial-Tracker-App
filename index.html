/* Layout: one calm column of frosted-glass cards floating over a soft grey wash, section titles above each card,

:root {

  --bg: #0B0E14; --paper: #151A23; --ink: #EEF1F6; --muted: #8E98AA; --rule: rgba(255,255,255,.08); --field: #1F2632;

  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

svg.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { max-width: 520px; margin: 0 auto; padding-block: 18px 112px; display: flex; flex-direction: column; gap: 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
.sheet { max-height: calc(100% - env(safe-area-inset-top, 0px) - 12px) !important; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px; }

.link { color: var(--accent); font-weight: 700; font-size: .88rem; }

.day { display: flex; justify-content: space-between; gap: 8px; padding: 14px 18px 4px; font-size: .8rem; font-weight: 600; color: var(--muted); }

.row .t { min-width: 0; display: flex; flex-direction: column; }
.row .t b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { font-weight: 700; white-space: nowrap; }
.row.m { padding: 12px 18px; }
.row.m > svg.ic { color: var(--muted); width: 18px; height: 18px; }
.mi { width: 40px; height: 40px; border-radius: 13px; background: var(--field); display: grid; place-items: center; }
.search { display: flex; align-items: center; gap: 10px; background: var(--paper); border-radius: 16px; padding: 0 16px; height: 50px; color: var(--muted); border: 1.5px solid transparent; }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--ink); }

/* Docked tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--rule);
  padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar > div { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 2px; color: var(--muted); font-size: .7rem; font-weight: 600; transition: transform .12s, color .15s; min-width: 0; }
.tab[aria-current="page"] { color: var(--ink); }
.tab.add { font-size: 0; gap: 0; }
.tab.add span { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.tab.add svg.ic { width: 24px; height: 24px; stroke-width: 2.2; }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet { width: 100%; max-width: 520px; max-height: 94%; background: var(--paper); border-radius: 26px 26px 0 0; display: flex; flex-direction: column; animation: up .26s cubic-bezier(.2,.9,.3,1); }
.sheet::before { content: ""; width: 40px; height: 4px; border-radius: 4px; background: var(--field); margin: 10px auto 2px; flex: none; }
.sheet-b { overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 18px;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-h h2 { margin: 0; font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
.sheet .slip { background: var(--bg); }
.sheet .sec-h { padding: 0; }

.f { display: flex; flex-direction: column; gap: 8px; }

.chip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--field)); font-weight: 700; }

.center { text-align: center; }

/* Insights */
.scoreline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

/* ---- Light monochrome glass ---- */
:root {
  color-scheme: light;
  --bg: #E9EAEE; --paper: rgba(255,255,255,.56); --ink: #0E0F12; --muted: #686B73; --rule: rgba(14,15,18,.09); --field: rgba(14,15,18,.055);
  --accent: #0E0F12; --accent-ink: #FFFFFF; --exp: #0E0F12; --inc: #0E0F12; --warn: #4A4D55;
  --p0: #17181C; --p1: #3D4047; --p2: #5E626B; --p3: #7F838C; --p4: #A0A4AC; --p5: #BCBFC6; --p6: #2B2D33; --p7: #8E929A;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --edge: rgba(255,255,255,.9);
  --glass-shadow: 0 10px 30px rgba(20,22,30,.07), inset 0 1px 0 rgba(255,255,255,.95);
  --blur: blur(22px) saturate(1.6);
}
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(70% 38% at 10% 0%, #FFFFFF 0, transparent 70%),
    radial-gradient(55% 32% at 105% 22%, #CDD0D8 0, transparent 70%),
    radial-gradient(60% 36% at -5% 62%, #D2D5DC 0, transparent 70%),
    radial-gradient(60% 40% at 95% 100%, #FFFFFF 0, transparent 70%),
    #E9EAEE; }
.slip, .note, .search, .iconbtn, .btn.soft, .wcard {
  background: var(--paper); border: 1px solid var(--edge); box-shadow: var(--glass-shadow);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.slip { border-radius: 26px; }
.note { border-radius: 18px; }
.search { border-radius: 99px; }
.search:focus-within { border-color: var(--ink); }
.iconbtn { border-radius: 50%; }
.month .iconbtn { border-radius: 50%; }
.btn { border-radius: 99px; }
.btn.small { border-radius: 99px; }
.link { text-decoration: underline; text-underline-offset: 3px; }
.badge { background: rgba(255,255,255,.7); border: 1px solid var(--edge); box-shadow: 0 2px 8px rgba(20,22,30,.06); }
.mi { border-radius: 50%; background: rgba(255,255,255,.7); border: 1px solid var(--edge); box-shadow: 0 2px 8px rgba(20,22,30,.06); }
.neg { font-weight: 800; }
.stack i { border-radius: 99px; }

/* floating glass tab bar */
.tabbar { left: 50%; right: auto; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: min(calc(100% - 24px), 460px);
  border-radius: 32px; border: 1px solid var(--edge); background: rgba(255,255,255,.5); padding: 7px 6px;
  backdrop-filter: blur(26px) saturate(1.8); -webkit-backdrop-filter: blur(26px) saturate(1.8);
  box-shadow: 0 14px 40px rgba(20,22,30,.16), inset 0 1px 0 rgba(255,255,255,.95); }
.tab { border-radius: 24px; padding: 7px 2px 6px; }
.tab[aria-current="page"] { color: var(--ink); background: rgba(14,15,18,.07); }
.tab.add span { box-shadow: 0 6px 16px rgba(14,15,18,.28); }
.app { padding-bottom: 124px; }

/* sheets */
.scrim { background: rgba(20,22,30,.26); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.sheet { background: rgba(243,244,247,.8); border: 1px solid var(--edge); border-bottom: 0; border-radius: 32px 32px 0 0;
  backdrop-filter: blur(36px) saturate(1.8); -webkit-backdrop-filter: blur(36px) saturate(1.8); box-shadow: 0 -10px 40px rgba(20,22,30,.14); }
.sheet::before { background: rgba(14,15,18,.18); }
.sheet .slip { background: rgba(255,255,255,.55); }
.sheet .iconbtn, .sheet .btn.soft { background: rgba(255,255,255,.6); }
.wcard { background: rgba(255,255,255,.55); border-radius: 22px; }
.wcard .nm span { background: rgba(255,255,255,.8); border: 1px solid var(--edge); }

/* forms */
.inp, .amt-in.sm { background: rgba(255,255,255,.6); border: 1px solid var(--edge); border-radius: 16px; box-shadow: inset 0 1px 2px rgba(20,22,30,.05); }
.inp:focus, .amt-in.sm:focus-within { border-color: var(--ink); }
.amt-in:focus-within { border-bottom-color: var(--ink); }
.quick button { background: rgba(255,255,255,.6); border: 1px solid var(--edge); color: var(--ink); }
.chip { background: rgba(255,255,255,.6); border: 1px solid var(--edge); box-shadow: 0 2px 8px rgba(20,22,30,.05); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; font-weight: 600; }
.emo { background: rgba(255,255,255,.6); border: 1px solid var(--edge); }
.emo[aria-pressed="true"] { border: 2px solid var(--ink); }
.sw { border: 0; }
.sw[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 3px; }

  function lsSave() {

  async function init() {

        COLLS.forEach(function (c) { (saved[c] || []).forEach(function (o) { D[c].set(o.id, o); }); });

      } else {
        DEFAULTS.wallets.forEach(function (o) { D.wallets.set(o.id, o); });

      S.status = standalone ? '' : 'To install Saku: tap the Share button in Safari, then "Add to Home Screen".';

    var pending = COLLS.length;
    var timer = setTimeout(function () { S.status = "Can't reach your saved data yet. Still trying."; refresh(); }, 10000);

  }

  // ---------- derived data ----------

  function monthTxns(ym) {

  function streaks() {
    var days = new Set(); D.txns.forEach(function (t) { if (t.date) days.add(t.date); });
    var d = new Date(), cur = 0;

  // ---------- screens ----------

      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Saku backup' }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
    document.body.append(a); a.click(); a.remove(); toast('Backup saved');
  }
  function restore() {
    var inp = $('backupFile'); inp.value = '';
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try { var o = JSON.parse(String(r.result)); if (!o || o.app !== 'saku') throw new Error('not saku'); openSheet(sheetRestore, { data: o }); }
        catch (e) { toast("That isn't a Saku backup file."); }
      };
      r.readAsText(f);
    };
    inp.click();
  }
  function sheetRestore(p) {
    var o = p.data, n = (o.txns || []).length, w = (o.wallets || []).length;
    return [sheetHead('Restore backup'),
      h('p', { class: 'tip', text: 'This backup has ' + n + (n === 1 ? ' entry' : ' entries') + ' in ' + w + (w === 1 ? ' wallet' : ' wallets') + (o.exported ? ', saved on ' + new Date(o.exported).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '') + '.' }),
      h('p', { class: 'err', text: 'Restoring replaces everything currently in Saku on this phone.' }),
      h('button', { class: 'btn primary', type: 'button', text: 'Replace with this backup', onclick: function () {
        COLLS.forEach(function (c) { var m = new Map(); (o[c] || []).forEach(function (x) { if (x && x.id) m.set(x.id, x); }); D[c] = m; });
        S.hide = !!o.hide; lsSave(); closeAll(); refresh(); toast('Backup restored');
      } }),
      h('button', { class: 'btn soft', type: 'button', text: 'Cancel', onclick: closeSheet })];
  }

  // ---------- toast ----------
  var toastTimer = null;
  function toast(msg, label, fn) {
    var t = $('toast'); t.replaceChildren(h('span', { text: msg }));
    if (label) t.append(h('button', { type: 'button', text: label, onclick: function () { t.hidden = true; fn(); } }));
    t.hidden = false; t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, label ? 6000 : 2400);
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && stack.length) closeSheet(); });

  refresh();
  init();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
})();
</script>
