<style>
/* Layout: one phone-width column of layered cards (soft outer shell, darker inner well), a floating tab bar, bottom sheets for every task.
   Single dark look by choice: a pocket ledger you check at night. */
:root {
  color-scheme: dark;
  --bg: #08090C; --card: #1A1B22; --inner: #101116; --field: #24262F; --ink: #F4F5F8; --muted: #9A9EAB; --line: rgba(255,255,255,.07);
  --accent: #A9B1FF; --accent-ink: #0B0C16; --exp: #FF6F69; --inc: #5EDCA0; --warn: #F5B94A;
  --p0: #FF8A5B; --p1: #6EA8FF; --p2: #5EDCA0; --p3: #B79BFF; --p4: #FF7EB6; --p5: #4FD1DC; --p6: #F5C451; --p7: #A0A7B8;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
svg.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { max-width: 480px; margin: 0 auto; padding-block: 14px 120px; display: flex; flex-direction: column; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
.sheet { max-height: calc(100% - env(safe-area-inset-top, 0px) - 12px) !important; }
.hello { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 4px 0; }
.hello h1 { margin: 0; font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; }
.hello p { margin: 0; color: var(--muted); font-size: .85rem; }
.note { margin: 0; padding: 10px 14px; border-radius: 16px; background: var(--card); color: var(--muted); font-size: .84rem; }

.card { background: var(--card); border-radius: 28px; padding: 4px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px 10px 16px; min-height: 52px; }
.card-h h2 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--muted); }
.inner { background: var(--inner); border-radius: 24px; padding: 16px; min-width: 0; }
.inner.flush { padding: 4px 0; }

.iconbtn { width: 40px; height: 40px; border-radius: 50%; background: var(--field); display: inline-grid; place-items: center; transition: transform .12s ease, background .12s; }
.iconbtn:active, .btn:active, .chip:active, .qa:active, .row:active, .wcard:active { transform: scale(.96); }
.iconbtn.dark { background: var(--inner); }
.month { display: flex; align-items: center; gap: 4px; }
.month b { min-width: 5.6em; text-align: center; font-weight: 600; font-size: .92rem; }
.month .iconbtn { width: 34px; height: 34px; }
.month svg.ic { width: 18px; height: 18px; }

.duo { display: grid; grid-template-columns: 1fr 1fr; }
.duo > div { padding: 2px 4px; min-width: 0; }
.duo > div + div { border-left: 1px solid var(--line); padding-left: 16px; }
.lbl { color: var(--muted); font-size: .84rem; display: flex; align-items: center; gap: 7px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--k, var(--muted)); flex: none; }
.big { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.huge { font-size: clamp(1.9rem, 9vw, 2.4rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; overflow-wrap: anywhere; }
.netline { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; color: var(--muted); }
.pos { color: var(--inc); } .neg { color: var(--exp); }

.qas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.qa { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: .82rem; font-weight: 500; transition: transform .12s; min-width: 0; }
.qa span { width: 100%; height: 56px; border-radius: 22px; background: var(--card); display: grid; place-items: center; }

.seg { display: flex; gap: 4px; padding: 4px; background: var(--field); border-radius: 99px; }
.seg button { flex: 1 1 0; min-width: 0; padding: 10px 8px; border-radius: 99px; color: var(--muted); font-weight: 600; font-size: .9rem; transition: background .18s, color .18s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button[aria-pressed="true"] { background: var(--inner); color: var(--ink); box-shadow: 0 1px 0 var(--line) inset; }

.donut { position: relative; width: 184px; max-width: 100%; aspect-ratio: 1; margin: 2px auto 16px; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut circle { fill: none; stroke-width: 12; transition: stroke-dasharray .5s ease, stroke-dashoffset .5s ease; }
.donut .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut .mid b { font-size: 1.5rem; font-weight: 700; }
.donut .mid small { color: var(--muted); font-size: .8rem; }
.slice { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; }
.slice .bar { grid-column: 2 / -1; }
.bar { height: 6px; border-radius: 99px; background: var(--field); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--k, var(--accent)); transition: width .4s ease; }
.badge { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 1.25rem; background: color-mix(in srgb, var(--k, var(--muted)) 20%, var(--inner)); flex: none; }
.sub { color: var(--muted); font-size: .8rem; }
.empty { text-align: center; padding: 22px 12px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
.empty .btn { margin-top: 16px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 0 18px; border-radius: 18px; font-weight: 700; transition: transform .12s, opacity .15s; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.soft { background: var(--field); }
.btn.danger { background: transparent; color: var(--exp); min-height: 44px; }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.small { width: auto; min-height: 38px; padding: 0 14px; border-radius: 12px; font-size: .85rem; font-weight: 600; }
.link { color: var(--accent); font-weight: 600; font-size: .88rem; }

.day { display: flex; justify-content: space-between; gap: 8px; padding: 14px 16px 4px; font-size: .78rem; font-weight: 600; color: var(--muted); }
.row { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 10px 16px; transition: transform .12s; }
.row .t { min-width: 0; display: flex; flex-direction: column; }
.row .t b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { font-weight: 700; white-space: nowrap; }
.search { display: flex; align-items: center; gap: 10px; background: var(--field); border-radius: 99px; padding: 0 16px; height: 48px; color: var(--muted); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--ink); }

.wcard { width: 100%; text-align: left; border-radius: 22px; padding: 16px; min-height: 124px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; color: #fff; transition: transform .12s;
  background: linear-gradient(135deg, color-mix(in srgb, var(--k) 78%, #000) 0%, color-mix(in srgb, var(--k) 30%, #06070A) 100%); }
.wcard + .wcard { margin-top: 8px; }
.wcard .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.wcard .nm { display: flex; align-items: center; gap: 10px; font-weight: 600; min-width: 0; }
.wcard .nm span { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.9); display: grid; place-items: center; font-size: 1.15rem; flex: none; }
.wcard .bal { font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
.wcard small { opacity: .8; }

/* Tab bar */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; gap: 4px; padding: 6px; border-radius: 99px;
  background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(0,0,0,.5); }
.tabbar button { width: 66px; height: 50px; border-radius: 99px; display: grid; place-items: center; color: var(--muted); transition: background .18s, color .18s, transform .12s; }
.tabbar button[aria-current="page"] { background: var(--inner); color: var(--ink); }
.tabbar button.add { background: var(--accent); color: var(--accent-ink); }
.tabbar button:active { transform: scale(.92); }
.tabbar svg.ic { width: 25px; height: 25px; }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet { width: 100%; max-width: 480px; max-height: 94%; background: #15161B; border-radius: 30px 30px 0 0; display: flex; flex-direction: column; animation: up .28s cubic-bezier(.2,.9,.3,1); }
.sheet::before { content: ""; width: 44px; height: 5px; border-radius: 9px; background: #4A4D58; margin: 10px auto 2px; flex: none; }
.sheet-b { overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 14px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-h h2 { margin: 0; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; }
@keyframes up { from { transform: translateY(40%); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.04); } }

.f { display: flex; flex-direction: column; gap: 7px; }
.f > label, .f > .cap { color: var(--muted); font-size: .84rem; }
.inp { width: 100%; min-width: 0; height: 52px; border-radius: 18px; background: var(--field); border: 1.5px solid transparent; padding: 0 16px; outline: none; }
.inp:focus { border-color: var(--accent); }
textarea.inp { height: auto; padding: 14px 16px; resize: none; line-height: 1.45; }
.amt-in { display: flex; align-items: center; gap: 10px; background: var(--field); border-radius: 22px; padding: 0 18px; height: 72px; border: 1.5px solid transparent; }
.amt-in:focus-within { border-color: var(--accent); }
.amt-in span { color: var(--muted); font-size: 1.3rem; font-weight: 600; }
.amt-in input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { padding: 8px 12px; border-radius: 12px; background: var(--field); font-weight: 600; font-size: .85rem; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.chip { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 4px; border-radius: 16px; background: var(--field); border: 1.5px solid transparent; font-size: .76rem; min-width: 0; transition: transform .12s, background .15s; }
.chip span { font-size: 1.3rem; line-height: 1; }
.chip em { font-style: normal; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--k, var(--accent)); background: color-mix(in srgb, var(--k, var(--accent)) 20%, var(--field)); animation: pop .22s ease; }
.hscroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll .chip { flex: 0 0 auto; min-width: 84px; padding: 10px 12px; }
.emo { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 14px; background: var(--field); font-size: 1.3rem; border: 1.5px solid transparent; }
.emo[aria-pressed="true"] { border-color: var(--accent); }
.sw { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; background: var(--k); border: 3px solid transparent; }
.sw[aria-pressed="true"] { border-color: var(--ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tip { color: var(--muted); font-size: .84rem; margin: 0; }
.err { color: var(--exp); font-size: .85rem; margin: 0; }
.listrow { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; text-align: left; padding: 12px 16px; }
.listrow + .listrow { border-top: 1px solid var(--line); }
.listrow .bar { grid-column: 2 / -1; }

.ring { position: relative; width: 170px; max-width: 100%; aspect-ratio: 1; margin: 4px auto 12px; }
.ring svg { width: 100%; height: 100%; transform: rotate(135deg); }
.ring circle { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dasharray .6s ease; }
.ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .mid b { font-size: 2.4rem; font-weight: 800; line-height: 1; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 99px; background: color-mix(in srgb, var(--k) 18%, var(--inner)); color: var(--k); font-weight: 600; font-size: .88rem; }
.center { text-align: center; }
.ind { padding: 14px 16px; } .ind + .ind { border-top: 1px solid var(--line); }
.ind b { display: block; font-size: 1.05rem; font-weight: 600; margin: 2px 0; }
.kn { display: grid; grid-template-columns: 1fr 1fr; }
.kn > div { padding: 14px 16px; border-top: 1px solid var(--line); min-width: 0; }
.kn > div:nth-child(odd) { border-right: 1px solid var(--line); }
.kn .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: var(--muted); }
.kn .chg { font-size: .76rem; padding: 2px 8px; border-radius: 99px; background: var(--field); color: var(--muted); }
.kn b { display: block; font-size: 1.05rem; font-weight: 700; overflow-wrap: anywhere; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; width: 100%; text-align: left; }
.toggle i { width: 50px; height: 30px; border-radius: 99px; background: var(--field); position: relative; flex: none; transition: background .2s; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle[aria-pressed="true"] i { background: var(--accent); }
.toggle[aria-pressed="true"] i::after { transform: translateX(20px); }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.stats3 > div { background: var(--inner); border-radius: 22px; padding: 14px; min-width: 0; }
.stats3 svg.ic { margin-bottom: 10px; }
.stats3 b { display: block; font-size: 1.05rem; font-weight: 700; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal small { text-align: center; color: var(--muted); font-size: .72rem; padding-bottom: 4px; }
.cal div { aspect-ratio: 1; border-radius: 11px; display: grid; place-items: center; font-size: .82rem; font-weight: 600; background: var(--field); color: var(--muted); }
.cal div.l1 { background: color-mix(in srgb, var(--inc) 30%, var(--field)); color: var(--ink); }
.cal div.l2 { background: color-mix(in srgb, var(--inc) 55%, var(--field)); color: var(--ink); }
.cal div.l3 { background: color-mix(in srgb, var(--inc) 85%, var(--field)); color: #06120C; }
.cal div.today { outline: 2px solid var(--ink); outline-offset: -2px; }
.cal div.blank { background: none; }
.goal { padding: 16px; } .goal + .goal { border-top: 1px solid var(--line); }
.goal .top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-bottom: 12px; }
.goal .adds { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.draft { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 40; max-width: calc(100% - 32px); background: #F4F5F8; color: #0B0C10; padding: 11px 16px; border-radius: 16px; display: flex; gap: 14px; align-items: center; font-size: .9rem; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: up .22s ease; }
#toast button { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; color: inherit; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="view"></div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div id="sheetRoot"></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="csvFile" accept=".csv,text/csv,text/plain" hidden>
<input type="file" id="backupFile" accept=".json,application/json" hidden>
